name: Library API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Grant Maven permission
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t library-api:ci .